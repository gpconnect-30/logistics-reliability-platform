apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: logistics}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - {name: POSTGRES_USER, value: logistics}
            - {name: POSTGRES_PASSWORD, value: logistics}
            - {name: POSTGRES_DB, value: logistics}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: pgdata, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: pgdata, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: logistics}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: logistics}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7.4
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: logistics}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
