apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking
  namespace: logistics
spec:
  replicas: 1
  selector:
    matchLabels: { app: tracking }
  template:
    metadata:
      labels: { app: tracking }
    spec:
      containers:
        - name: tracking
          image: guruprasanna30/logistics-tracking:v6
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: logistics-config } }]
          env:
            - name: SERVICE_NAME
              value: "tracking"
---
apiVersion: v1
kind: Service
metadata:
  name: tracking
  namespace: logistics
spec:
  selector: { app: tracking }
  ports: [{ port: 8000, targetPort: 8000 }]
